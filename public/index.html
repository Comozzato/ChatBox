<!DOCTYPE html>
<html lang="pt-br">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>WhatsApp Web QR Code</title>
    <script src="/socket.io/socket.io.js"></script>
  </head>
  <body>
    <h1>Escaneie o QR Code para iniciar</h1>

    <div id="qr-container">
      <!-- Aqui a imagem com id "qr-code" será atualizada com o novo QR Code -->
      <img id="qr-code" src="./qr.png" alt="QR Code" />
    </div>

    <script>
      // Conectando ao servidor Socket.IO
      const socket = io();

      // Quando o evento 'qr' for disparado, o QR Code será recebido
      socket.on("qr", (qrFilePath) => {
        // Adiciona um parâmetro de query único para evitar o cache da imagem
        const timestamp = new Date().getTime();
        document.getElementById("qr-code").src = `${qrFilePath}?t=${timestamp}`;
      });
    </script>
  </body>
</html>
